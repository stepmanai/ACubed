[project]
name = "acubed"
version = "0.1.0"
description = "ACubed pipeline"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.3.0",
    "httpx>=0.28.1",
    "narwhals>=2.21.2",
    "pandas>=2.2.0",
    "pyarrow>=24.0.0",
    "requests>=2.32.0",
    "scipy>=1.15.3",
    "tqdm>=4.68.3",
]

[project.scripts]
ingest = "acubed.cli.ingest:main"
features = "acubed.cli.features:main"
ingest_refactored = "acubed.interfaces.cli.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
